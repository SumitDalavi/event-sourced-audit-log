version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000

  # ── Tier 2 Companion Services (started via: docker compose --profile live up) ──
  postgres:
    image: postgres:15-alpine
    profiles: ["live"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: audit_log
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
